services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: citylab-backend
    expose:
      - "8000"
    environment:
      DATA_DIR: /app/data
      CORPUS_DIR: /app/corpus
      DEMO_MODE: ${DEMO_MODE:-true}
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-true}
      AUTH_TOKENS: ${AUTH_TOKENS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
    volumes:
      - citylab_public_demo_data:/app/data
      - ./corpus:/app/corpus:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: citylab-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  citylab_public_demo_data:
    driver: local
